<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM Mart Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 30px 15px;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .hero p {
      color: #555;
    }

    .products {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: contain;
      border-radius: 10px;
    }

    .product h3 {
      margin: 12px 0 7px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .order-btn {
      border: none;
      background: #16a34a;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    .order-btn:hover {
      background: #15803d;
    }

    .contact {
      background: white;
      text-align: center;
      padding: 30px 15px;
      margin-top: 20px;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 18px;
    }

    /* Popup */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      padding: 15px;
      overflow-y: auto;
    }
